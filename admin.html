<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>阿咘奶粉錢後台管理系統 (手機優化版)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen font-sans text-slate-800">

  <!-- 頂部導覽列 -->
  <header class="bg-slate-800 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <span class="text-2xl">👨‍🌾</span>
        <h1 class="text-base sm:text-lg font-bold">阿咘奶粉錢 - 後台</h1>
      </div>
      
      <div class="flex items-center space-x-2">
        <a href="./index.html" target="_blank" class="text-xs bg-emerald-600 hover:bg-emerald-700 px-2.5 py-1.5 rounded-lg text-white font-bold transition flex items-center space-x-1 shadow-sm">
          <span>🛒</span>
          <span class="hidden sm:inline">查看前台</span>
          <span class="sm:hidden">前台</span>
        </a>
        <button id="btn-logout" onclick="handleLogout()" class="hidden text-xs bg-red-600 hover:bg-red-700 px-2.5 py-1.5 rounded-lg text-white font-bold transition">登出</button>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-3 py-4 sm:px-4 sm:py-6">

    <!-- 1. 登入區塊 -->
    <div id="admin-login-box" class="max-w-md mx-auto bg-white p-6 sm:p-8 rounded-2xl shadow-xl border border-slate-200 mt-6 sm:mt-12">
      <div class="text-center mb-6">
        <span class="text-4xl">🔐</span>
        <h2 class="text-2xl font-bold text-slate-800 mt-2">管理員驗證</h2>
        <p class="text-sm text-slate-500">請輸入後台帳號密碼</p>
      </div>
      <form onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">帳號</label>
          <input type="text" id="login-user" value="farmer" required class="w-full px-3 py-2.5 border rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none text-base">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">密碼</label>
          <input type="password" id="login-pass" placeholder="預設 888888" required class="w-full px-3 py-2.5 border rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none text-base">
        </div>
        <button type="submit" id="btn-login" class="w-full bg-slate-800 text-white font-bold py-3 rounded-xl hover:bg-slate-900 active:scale-[0.98] transition text-base shadow-md">登入系統</button>
      </form>
    </div>

    <!-- 2. 管理面板 -->
    <div id="admin-panel" class="hidden space-y-4">
      
      <!-- 主分頁切換 -->
      <div class="grid grid-cols-2 gap-2 bg-slate-200 p-1 rounded-xl">
        <button onclick="switchTab('fruits')" id="tab-btn-fruits" class="py-2.5 text-center rounded-lg font-bold text-sm bg-emerald-600 text-white shadow-sm transition">🍎 水果品項與輪播</button>
        <button onclick="switchTab('orders')" id="tab-btn-orders" class="py-2.5 text-center rounded-lg font-bold text-sm text-slate-600 hover:bg-slate-100 transition">📋 訂單紀錄與核對</button>
      </div>

      <!-- A. 水果商品與現況輪播管理 -->
      <div id="panel-fruits" class="bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border-b pb-3">
          <div>
            <h3 class="text-lg font-bold text-slate-800">水果商品與現況輪播</h3>
            <p class="text-xs text-slate-500">勾選「📺 輪播中」的照片會自動登上首頁頂部現況大看板</p>
          </div>
          <div class="flex space-x-2 w-full sm:w-auto">
            <button onclick="addNewFruitRow()" class="flex-1 sm:flex-none px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold border">+ 新增水果</button>
            <button onclick="saveFruitsToBackend()" id="btn-save-fruits" class="flex-1 sm:flex-none px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold shadow-sm">💾 儲存更新</button>
          </div>
        </div>

        <div id="admin-fruit-container" class="space-y-4">
          <div class="text-center py-8 text-slate-400">正在載入水果資料...</div>
        </div>
      </div>

      <!-- B. 訂單紀錄檢視與核款 -->
      <div id="panel-orders" class="hidden bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
        <div class="flex justify-between items-center border-b pb-3">
          <h3 class="text-lg font-bold text-slate-800">最新訂單與核款清單</h3>
          <button onclick="loadAdminOrders()" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl text-xs font-bold">🔄 重新整理</button>
        </div>

        <div class="flex items-center gap-1.5 overflow-x-auto pb-1 no-scrollbar" id="order-filter-bar"></div>

        <div id="admin-order-container" class="space-y-4 pt-1">
          <div class="text-center py-8 text-slate-400">正在載入訂單資料...</div>
        </div>
      </div>

    </div>

  </main>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxQsDLOyagMbYOOw-uYBozoZXRRq5fmEutsZCn0Q3DjtNjq9Uf10PQ7zMsXETsy0UKf/exec";

    let fruitsData = [];
    let rawOrdersData = [];
    let currentOrderFilter = 'ALL';
    let draggedImgInfo = null;

    window.onload = function() {
      checkAuthStatus();
    };

    function getTodayTag() {
      const now = new Date();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      return `${mm}/${dd} 剛採收實拍`;
    }

    async function callGasApi(action, extraData = {}) {
      try {
        const payload = JSON.stringify({ action: action, ...extraData });
        const res = await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: payload
        });
        return await res.json();
      } catch (err) {
        console.error("API 呼叫失敗:", err);
        return { status: "error", message: "網路通訊失敗: " + err.message };
      }
    }

    function checkAuthStatus() {
      const isLoggedIn = sessionStorage.getItem("isFarmerLogin") === "true";
      document.getElementById('admin-login-box').classList.toggle('hidden', isLoggedIn);
      document.getElementById('admin-panel').classList.toggle('hidden', !isLoggedIn);
      document.getElementById('btn-logout').classList.toggle('hidden', !isLoggedIn);
      
      if (isLoggedIn) {
        loadFruits();
        loadAdminOrders();
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const user = document.getElementById('login-user').value;
      const pass = document.getElementById('login-pass').value;
      const btn = document.getElementById('btn-login');

      btn.disabled = true;
      btn.innerText = "驗證中...";

      const res = await callGasApi("checkLogin", { user: user, pass: pass });
      btn.disabled = false;
      btn.innerText = "登入系統";

      if (res && res.status === "success") {
        sessionStorage.setItem("isFarmerLogin", "true");
        checkAuthStatus();
      } else {
        alert(res ? res.message : "帳號或密碼錯誤");
      }
    }

    function handleLogout() {
      sessionStorage.removeItem("isFarmerLogin");
      checkAuthStatus();
    }

    function switchTab(tab) {
      document.getElementById('panel-fruits').classList.toggle('hidden', tab !== 'fruits');
      document.getElementById('panel-orders').classList.toggle('hidden', tab !== 'orders');

      document.getElementById('tab-btn-fruits').className = tab === 'fruits' ? "py-2.5 text-center rounded-lg font-bold text-sm bg-emerald-600 text-white shadow-sm transition" : "py-2.5 text-center rounded-lg font-bold text-sm text-slate-600 hover:bg-slate-100 transition";
      document.getElementById('tab-btn-orders').className = tab === 'orders' ? "py-2.5 text-center rounded-lg font-bold text-sm bg-emerald-600 text-white shadow-sm transition" : "py-2.5 text-center rounded-lg font-bold text-sm text-slate-600 hover:bg-slate-100 transition";
    }

    // 確保每款水果的 carouselItems 與 imageUrl 保持同步
    function normalizeFruitCarousel(fruit) {
      const urls = (fruit.imageUrl || "").split(/[\n,]+/).map(u => u.trim()).filter(Boolean);
      const existingItems = Array.isArray(fruit.carouselItems) ? fruit.carouselItems : [];

      fruit.carouselItems = urls.map(u => {
        const match = existingItems.find(item => item.url === u);
        return {
          url: u,
          carousel: match ? Boolean(match.carousel) : false,
          caption: match && match.caption ? match.caption : ""
        };
      });
      fruit.imageUrl = urls.join(',');
    }

    async function loadFruits() {
      const res = await callGasApi("getFruits");
      if (res && res.status === "success") {
        fruitsData = (res.data || []).map(f => {
          normalizeFruitCarousel(f);
          return f;
        });
        renderAdminFruits();
      }
    }

    // 💡 渲染照片縮圖（含：封面標示 / 設為封面 / 輪播中切換 / 拖曳對調 / 刪除）
    function renderThumbnails(fruit, fruitIdx) {
      normalizeFruitCarousel(fruit);
      const items = fruit.carouselItems;

      if (items.length === 0) {
        return `<div class="w-20 h-20 rounded-xl bg-slate-200 border flex items-center justify-center text-slate-400 text-xs font-bold flex-shrink-0">無圖片</div>`;
      }

      return items.map((item, imgIdx) => `
        <div class="relative flex-shrink-0 w-24 bg-white rounded-xl border ${item.carousel ? 'border-emerald-500 ring-2 ring-emerald-200' : 'border-slate-200'} p-1 shadow-sm">
          <div class="relative">
            <img src="${item.url}" 
                 referrerpolicy="no-referrer" 
                 draggable="true"
                 ondragstart="handleDragStart(event, ${fruitIdx}, ${imgIdx})"
                 ondragover="handleDragOver(event)"
                 ondrop="handleDrop(event, ${fruitIdx}, ${imgIdx})"
                 class="w-full h-20 object-cover rounded-lg bg-slate-200 cursor-grab active:cursor-grabbing transition" 
                 title="按住拖曳可調整順序">

            ${imgIdx === 0 ? `
              <span class="absolute top-1 left-1 bg-slate-900/80 text-white text-[9px] font-bold px-1.5 py-0.5 rounded">封面圖</span>
            ` : `
              <button type="button" 
                      onclick="setAsCover(${fruitIdx}, ${imgIdx})" 
                      class="absolute top-1 left-1 bg-slate-800/75 hover:bg-slate-900 text-white text-[9px] font-bold px-1.5 py-0.5 rounded transition">
                設為封面
              </button>
            `}

            <button type="button" 
                    onclick="deleteSingleImage(${fruitIdx}, ${imgIdx})" 
                    class="absolute -top-2 -right-2 bg-red-500 hover:bg-red-600 text-white rounded-full w-5 h-5 text-[11px] font-bold flex items-center justify-center shadow-md transition" 
                    title="刪除此圖片">✕</button>
          </div>

          <!-- 一鍵勾選是否上首頁輪播 -->
          <button type="button"
                  onclick="toggleCarousel(${fruitIdx}, ${imgIdx})"
                  class="mt-1 w-full py-1 rounded-lg text-[10px] font-bold transition flex items-center justify-center gap-1 ${
                    item.carousel 
                      ? 'bg-emerald-600 text-white shadow-sm' 
                      : 'bg-slate-100 hover:bg-slate-200 text-slate-600'
                  }">
            <span>${item.carousel ? '📺 輪播中' : '⬜ 加入輪播'}</span>
          </button>
        </div>
      `).join('');
    }

    // 切換該張照片是否加入首頁輪播
    function toggleCarousel(fruitIdx, imgIdx) {
      normalizeFruitCarousel(fruitsData[fruitIdx]);
      const target = fruitsData[fruitIdx].carouselItems[imgIdx];
      if (!target) return;

      target.carousel = !target.carousel;
      if (target.carousel && !target.caption) {
        target.caption = getTodayTag();
      }
      renderAdminFruits();
    }

    function updateCarouselCaption(fruitIdx, imgIdx, newCaption) {
      if (fruitsData[fruitIdx] && fruitsData[fruitIdx].carouselItems[imgIdx]) {
        fruitsData[fruitIdx].carouselItems[imgIdx].caption = newCaption;
      }
    }

    function handleDragStart(e, fruitIdx, imgIdx) {
      draggedImgInfo = { fruitIdx, imgIdx };
      e.dataTransfer.effectAllowed = 'move';
    }

    function handleDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
    }

    function handleDrop(e, targetFruitIdx, targetImgIdx) {
      e.preventDefault();
      if (!draggedImgInfo) return;

      const { fruitIdx, imgIdx } = draggedImgInfo;
      if (fruitIdx !== targetFruitIdx || imgIdx === targetImgIdx) return;

      normalizeFruitCarousel(fruitsData[fruitIdx]);
      const items = fruitsData[fruitIdx].carouselItems;

      const temp = items[imgIdx];
      items[imgIdx] = items[targetImgIdx];
      items[targetImgIdx] = temp;

      fruitsData[fruitIdx].imageUrl = items.map(i => i.url).join(',');
      renderAdminFruits();
    }

    function setAsCover(fruitIdx, imgIdx) {
      normalizeFruitCarousel(fruitsData[fruitIdx]);
      const items = fruitsData[fruitIdx].carouselItems;
      if (imgIdx === 0 || imgIdx >= items.length) return;

      const targetItem = items.splice(imgIdx, 1)[0];
      items.unshift(targetItem);

      fruitsData[fruitIdx].imageUrl = items.map(i => i.url).join(',');
      renderAdminFruits();
    }

    function deleteSingleImage(fruitIdx, imgIdx) {
      normalizeFruitCarousel(fruitsData[fruitIdx]);
      const items = fruitsData[fruitIdx].carouselItems;
      items.splice(imgIdx, 1);

      fruitsData[fruitIdx].imageUrl = items.map(i => i.url).join(',');
      renderAdminFruits();
    }

    function handleManualUrlChange(fruitIdx, newUrlStr) {
      fruitsData[fruitIdx].imageUrl = newUrlStr;
      normalizeFruitCarousel(fruitsData[fruitIdx]);
      renderAdminFruits();
    }

    function renderAdminFruits() {
      const container = document.getElementById('admin-fruit-container');
      if (fruitsData.length === 0) {
        container.innerHTML = `<div class="text-center py-8 text-slate-400">目前尚無水果資料</div>`;
        return;
      }

      container.innerHTML = fruitsData.map((f, idx) => {
        normalizeFruitCarousel(f);
        const activeCarouselItems = f.carouselItems
          .map((item, imgIdx) => ({ ...item, imgIdx }))
          .filter(item => item.carousel);

        return `
        <div class="bg-slate-50 border border-slate-200 rounded-2xl p-4 space-y-3 relative shadow-sm" data-id="${f.id}">
          
          <!-- 圖片預覽列 -->
          <div class="space-y-2">
            <div class="flex items-start gap-2.5 overflow-x-auto pb-1.5 pt-1" id="img-preview-box-${idx}">
              ${renderThumbnails(f, idx)}
            </div>
            <p class="text-[11px] text-slate-400 font-bold">💡 提示：點擊照片下方「加入輪播」可登上首頁看板；按住照片可拖曳排序</p>

            <!-- 已勾選輪播的照片圖說設定區 -->
            ${activeCarouselItems.length > 0 ? `
              <div class="bg-emerald-50/80 border border-emerald-200 rounded-xl p-2.5 space-y-2">
                <div class="text-xs font-bold text-emerald-800 flex items-center gap-1">
                  <span>📺 首頁輪播現況標籤設定（共 ${activeCarouselItems.length} 張輪播中）</span>
                </div>
                ${activeCarouselItems.map(cItem => `
                  <div class="flex items-center gap-2 bg-white p-1.5 rounded-lg border border-emerald-100">
                    <img src="${cItem.url}" referrerpolicy="no-referrer" class="w-9 h-9 rounded object-cover flex-shrink-0">
                    <input type="text" 
                           value="${cItem.caption || ''}" 
                           onchange="updateCarouselCaption(${idx}, ${cItem.imgIdx}, this.value)"
                           placeholder="輸入現況標籤，例如：${getTodayTag()}"
                           class="w-full text-xs px-2 py-1.5 border border-slate-200 rounded-md focus:ring-2 focus:ring-emerald-500 outline-none text-slate-700 font-medium">
                  </div>
                `).join('')}
              </div>
            ` : ''}

            <div>
              <label class="block text-xs font-bold text-slate-500 mb-1">水果名稱</label>
              <input type="text" value="${f.name || ''}" onchange="fruitsData[${idx}].name=this.value" class="w-full px-3 py-1.5 border border-slate-300 rounded-lg font-bold text-slate-800 focus:ring-2 focus:ring-emerald-500 outline-none text-base">
            </div>
          </div>

          <!-- 單價 / 庫存 / 狀態 -->
          <div class="grid grid-cols-3 gap-2">
            <div>
              <label class="block text-xs font-bold text-slate-500 mb-1">單價 (元)</label>
              <input type="number" value="${f.price}" onchange="fruitsData[${idx}].price=Number(this.value)" class="w-full px-2 py-1.5 border border-slate-300 rounded-lg font-bold text-emerald-600 text-sm outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-500 mb-1">剩餘庫存</label>
              <input type="number" value="${f.stock !== undefined ? f.stock : 0}" onchange="fruitsData[${idx}].stock=Number(this.value)" class="w-full px-2 py-1.5 border border-slate-300 rounded-lg font-bold text-slate-700 text-sm outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-500 mb-1">上架狀態</label>
              <select onchange="fruitsData[${idx}].status=this.value" class="w-full px-1 py-1.5 border border-slate-300 rounded-lg font-bold text-slate-700 bg-white text-sm outline-none focus:ring-2 focus:ring-emerald-500">
                <option value="ON" ${f.status === 'ON' ? 'selected' : ''}>🟢 上架</option>
                <option value="OFF" ${f.status === 'OFF' ? 'selected' : ''}>🔴 下架</option>
              </select>
            </div>
          </div>

          <!-- 商品說明 / 備註 -->
          <div>
            <label class="block text-xs font-bold text-slate-500 mb-1">商品說明 / 備註</label>
            <textarea 
              onchange="fruitsData[${idx}].description=this.value" 
              rows="2" 
              class="w-full px-2 py-1.5 border border-slate-300 rounded-lg text-xs text-slate-700 outline-none focus:ring-2 focus:ring-emerald-500" 
              placeholder="例如：甜度 15 度、口感酥脆、產地直送...">${f.description || ''}</textarea>
          </div>

          <!-- 圖片網址列表 -->
          <div>
            <label class="block text-xs font-bold text-slate-500 mb-1">圖片網址列表</label>
            <input type="text" value="${f.imageUrl || ''}" onchange="handleManualUrlChange(${idx}, this.value)" class="w-full px-2 py-1.5 border border-slate-300 rounded-lg text-xs text-slate-600 outline-none focus:ring-2 focus:ring-emerald-500" placeholder="https://... , https://...">
          </div>

          <!-- 批量上傳圖片（自動壓縮） -->
          <div class="bg-white p-2.5 rounded-xl border border-slate-200 space-y-1">
            <div class="flex justify-between items-center">
              <label class="block text-xs font-bold text-slate-600">📷 上傳現況照片 (自動壓縮、可多選)</label>
              <span id="upload-status-${idx}" class="text-[11px] font-bold text-emerald-600"></span>
            </div>
            <input type="file" accept="image/*" multiple onchange="uploadFruitImage(this, ${idx})" class="w-full text-xs text-slate-500 file:mr-2 file:py-1 file:px-2.5 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100">
          </div>
        </div>
        `;
      }).join('');
    }

    function addNewFruitRow() {
      fruitsData.push({
        id: "F" + (fruitsData.length + 1),
        name: "新品水果",
        price: 100,
        stock: 50,
        status: "ON",
        imageUrl: "",
        description: "",
        carouselItems: []
      });
      renderAdminFruits();
    }

    // 前端 Canvas 自動壓縮圖片，加快果園手機上傳與前台輪播速度
    function compressImageFile(file, maxWidth = 1200, quality = 0.82) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = function(event) {
          const img = new Image();
          img.onload = function() {
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            const dataUrl = canvas.toDataURL('image/jpeg', quality);
            resolve({
              name: file.name.replace(/\.[^/.]+$/, "") + ".jpg",
              mimeType: "image/jpeg",
              base64: dataUrl.split(',')[1]
            });
          };
          img.onerror = reject;
          img.src = event.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function uploadFruitImage(fileInput, idx) {
      const files = Array.from(fileInput.files);
      if (files.length === 0) return;

      const statusEl = document.getElementById(`upload-status-${idx}`);
      if (statusEl) statusEl.innerText = `⏳ 壓縮轉檔中 (共 ${files.length} 張)...`;

      try {
        const fileDataList = await Promise.all(files.map(file => compressImageFile(file)));

        if (statusEl) statusEl.innerText = `☁️ 上傳 Google Drive 中...`;

        const res = await callGasApi("uploadMultipleImages", { files: fileDataList });

        if (res && res.status === "success" && res.urls) {
          const newUrlsStr = res.urls.join(',');
          const existingUrls = (fruitsData[idx].imageUrl || "").trim();

          fruitsData[idx].imageUrl = existingUrls ? `${existingUrls},${newUrlsStr}` : newUrlsStr;
          normalizeFruitCarousel(fruitsData[idx]);

          // 預先填入今日實拍日期標籤，方便一鍵勾選輪播
          const todayTag = getTodayTag();
          res.urls.forEach(u => {
            const item = fruitsData[idx].carouselItems.find(x => x.url === u);
            if (item && !item.caption) item.caption = todayTag;
          });

          if (statusEl) statusEl.innerText = `✅ 成功上傳 ${files.length} 張！(記得按儲存更新)`;
          fileInput.value = ""; 
          renderAdminFruits(); 
        } else {
          alert("圖片上傳失敗：" + (res.message || "未知錯誤"));
          if (statusEl) statusEl.innerText = "❌ 上傳失敗";
        }
      } catch (err) {
        console.error(err);
        alert("圖片壓縮或傳送時發生錯誤！");
        if (statusEl) statusEl.innerText = "❌ 發生錯誤";
      }
    }

    async function saveFruitsToBackend() {
      const btn = document.getElementById('btn-save-fruits');
      if (btn) {
        btn.disabled = true;
        btn.innerText = "⏳ 儲存中...";
      }

      fruitsData.forEach(f => normalizeFruitCarousel(f));
      const res = await callGasApi("updateFruits", { fruits: fruitsData });

      if (btn) {
        btn.disabled = false;
        btn.innerText = "💾 儲存更新";
      }

      if (res && res.status === "success") {
        alert(res.message || "水果資料與輪播設定儲存成功！");
        loadFruits();
      } else {
        alert("儲存失敗：" + (res ? res.message : "未知錯誤"));
      }
    }

    // ------------------- 訂單管理與狀態分頁 -------------------

    async function loadAdminOrders() {
      const res = await callGasApi("getOrders");
      if (res && res.status === "success") {
        rawOrdersData = res.data || [];
        renderOrderFilterBar();
        renderAdminOrders();
      }
    }

    function setOrderFilter(statusKey) {
      currentOrderFilter = statusKey;
      renderOrderFilterBar();
      renderAdminOrders();
    }

    function renderOrderFilterBar() {
      const statuses = [
        { key: 'ALL', label: '全部' },
        { key: '待處理', label: '⏳ 待處理' },
        { key: '處理中', label: '⚙️ 處理中' },
        { key: '已出貨', label: '🚚 已出貨' },
        { key: '已完成', label: '✅ 已完成' },
        { key: '已取消', label: '❌ 已取消' }
      ];

      const barHtml = statuses.map(s => {
        const count = s.key === 'ALL'
          ? rawOrdersData.length
          : rawOrdersData.filter(o => o.status === s.key).length;

        const isActive = currentOrderFilter === s.key;
        const activeClass = isActive
          ? 'bg-slate-800 text-white font-bold shadow-sm'
          : 'bg-slate-100 text-slate-600 hover:bg-slate-200 font-medium';

        const badgeClass = isActive
          ? 'bg-emerald-500 text-white'
          : 'bg-slate-200 text-slate-700';

        return `
          <button onclick="setOrderFilter('${s.key}')" class="px-3 py-1.5 rounded-xl text-xs whitespace-nowrap transition flex items-center space-x-1.5 flex-shrink-0 ${activeClass}">
            <span>${s.label}</span>
            <span class="${badgeClass} text-[10px] px-1.5 py-0.2 rounded-full font-bold">${count}</span>
          </button>
        `;
      }).join('');

      document.getElementById('order-filter-bar').innerHTML = barHtml;
    }

    function formatOrderItems(itemsStr) {
      try {
        const parsed = JSON.parse(itemsStr);
        if (typeof parsed === 'object' && parsed !== null) {
          const parts = [];
          for (let id in parsed) {
            const f = fruitsData.find(x => x.id === id);
            const name = f ? f.name : id;
            parts.push(`${name} x ${parsed[id]}斤`);
          }
          return parts.join(', ');
        }
      } catch (e) {}
      return itemsStr;
    }

    function renderAdminOrders() {
      const container = document.getElementById('admin-order-container');
      
      let filteredOrders = rawOrdersData;
      if (currentOrderFilter !== 'ALL') {
        filteredOrders = rawOrdersData.filter(o => o.status === currentOrderFilter);
      }

      if (!filteredOrders || filteredOrders.length === 0) {
        const statusText = currentOrderFilter === 'ALL' ? '任何' : `「${currentOrderFilter}」`;
        container.innerHTML = `
          <div class="text-center py-12 bg-slate-50 rounded-2xl border border-dashed border-slate-200 text-slate-400 space-y-2">
            <span class="text-3xl">📭</span>
            <p class="text-xs font-bold">目前沒有 ${statusText} 狀態的訂單</p>
          </div>`;
        return;
      }

      container.innerHTML = filteredOrders.map(o => {
        let payBadgeClass = "bg-amber-100 text-amber-800 border-amber-200";
        if (o.paymentStatus === "已收款") payBadgeClass = "bg-emerald-100 text-emerald-800 font-bold border-emerald-200";
        if (o.paymentStatus === "退款中") payBadgeClass = "bg-rose-100 text-rose-800 border-rose-200";

        return `
        <div class="bg-slate-50 border border-slate-200 rounded-2xl p-4 space-y-3 shadow-sm">
          
          <div class="flex justify-between items-start border-b border-slate-200 pb-2">
            <div>
              <div class="font-bold text-emerald-700 text-base">${o.orderId}</div>
              <div class="text-xs text-slate-400">${o.time || ''}</div>
            </div>
            <div>
              <span class="text-xs px-2.5 py-1 rounded-lg border ${payBadgeClass} font-bold inline-block">
                ${o.paymentStatus || '未確認'}
              </span>
            </div>
          </div>

          <div class="space-y-1 text-sm">
            <div class="font-bold text-slate-800">${o.name} <span class="text-slate-500 font-normal">(${o.phone})</span></div>
            <div class="text-xs text-slate-500">📍 ${o.address || '未填寫地址'}</div>
            ${o.email ? `<div class="text-xs text-slate-500">✉️ ${o.email}</div>` : ''}
            ${o.note ? `<div class="text-xs text-amber-700 bg-amber-50 px-2 py-1 rounded-lg border border-amber-100">📝 備註：${o.note}</div>` : ''}
          </div>

          <div class="bg-white p-3 rounded-xl border border-slate-200 text-xs text-slate-700 space-y-1">
            <div class="font-bold text-slate-500 mb-1">📦 訂購品項：</div>
            <div>${formatOrderItems(o.items)}</div>
          </div>

          <div class="grid grid-cols-2 gap-2 pt-1">
            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">📦 訂單處理狀態</label>
              <select id="status-${o.orderId}" class="w-full px-2.5 py-1.5 text-xs rounded-xl border border-slate-300 bg-white font-bold text-slate-700 focus:ring-2 focus:ring-emerald-500 outline-none shadow-sm">
                <option value="待處理" ${o.status === '待處理' ? 'selected' : ''}>⏳ 待處理</option>
                <option value="處理中" ${o.status === '處理中' ? 'selected' : ''}>⚙️ 處理中</option>
                <option value="已出貨" ${o.status === '已出貨' ? 'selected' : ''}>🚚 已出貨</option>
                <option value="已完成" ${o.status === '已完成' ? 'selected' : ''}>✅ 已完成</option>
                <option value="已取消" ${o.status === '已取消' ? 'selected' : ''}>❌ 已取消</option>
              </select>
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">💰 付款狀態確認</label>
              <select id="pay-status-${o.orderId}" class="w-full px-2.5 py-1.5 text-xs rounded-xl border border-slate-300 bg-white font-bold text-slate-700 focus:ring-2 focus:ring-emerald-500 outline-none shadow-sm">
                <option value="未確認" ${(!o.paymentStatus || o.paymentStatus === '未確認') ? 'selected' : ''}>🔴 未確認</option>
                <option value="已收款" ${o.paymentStatus === '已收款' ? 'selected' : ''}>🟢 已收款</option>
                <option value="待核對" ${o.paymentStatus === '待核對' ? 'selected' : ''}>🟡 待核對</option>
                <option value="退款中" ${o.paymentStatus === '退款中' ? 'selected' : ''}>🟣 退款中</option>
              </select>
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">🚚 物流單號 / 追蹤號碼</label>
            <input type="text" id="tracking-${o.orderId}" value="${o.trackingNumber || ''}" placeholder="例如：黑貓宅急便 908123456" class="w-full px-2.5 py-1.5 text-xs border border-slate-300 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500 bg-white">
          </div>

          <div class="flex items-center justify-between pt-2 border-t border-slate-200">
            <label class="flex items-center space-x-1.5 text-xs text-slate-600 cursor-pointer">
              <input type="checkbox" id="notify-${o.orderId}" checked class="rounded text-emerald-600 focus:ring-emerald-500 w-4 h-4">
              <span>✉️ 寄送 Email 通知客戶</span>
            </label>

            <button onclick="saveOrderUpdate('${o.orderId}')" id="btn-save-order-${o.orderId}" class="px-3.5 py-1.5 bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white rounded-xl text-xs font-bold shadow-sm transition">
              💾 儲存變更
            </button>
          </div>

          <div class="text-right font-bold text-base text-emerald-600 pt-1">
            總金額：$${o.totalAmount} 元
          </div>

        </div>
        `;
      }).join('');
    }

    async function saveOrderUpdate(orderId) {
      const status = document.getElementById(`status-${orderId}`).value;
      const paymentStatus = document.getElementById(`pay-status-${orderId}`).value;
      const trackingNumber = document.getElementById(`tracking-${orderId}`).value.trim();
      const notifyMember = document.getElementById(`notify-${orderId}`).checked;

      const btn = document.getElementById(`btn-save-order-${orderId}`);
      if (btn) {
        btn.disabled = true;
        btn.innerText = "⏳ 儲存中...";
      }

      const res = await callGasApi("updateOrderStatus", {
        orderId: orderId,
        status: status,
        paymentStatus: paymentStatus,
        trackingNumber: trackingNumber,
        notifyMember: notifyMember
      });

      if (btn) {
        btn.disabled = false;
        btn.innerText = "💾 儲存變更";
      }

      if (res && res.status === "success") {
        alert(res.message || `訂單 ${orderId} 資料已成功更新！`);
        loadAdminOrders();
      } else {
        alert("更新失敗：" + (res ? res.message : "未知錯誤"));
      }
    }
  </script>
</body>
</html>
