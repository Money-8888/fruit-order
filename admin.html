<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>阿咘奶粉錢後台管理系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen font-sans text-slate-800">

  <!-- 頂部欄 -->
  <header class="bg-slate-800 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <span class="text-2xl">👨‍🌾</span>
        <h1 class="text-xl font-bold">鮮果嚴選 - 農夫管理後台</h1>
      </div>
      
      <!-- 右側按鈕區 -->
      <div class="flex items-center space-x-3">
        <!-- 💡 連結到顧客前台 (預設開新分頁) -->
        <a href="./index.html" target="_blank" class="text-xs bg-emerald-600 hover:bg-emerald-700 px-3 py-1.5 rounded-lg text-white font-bold transition flex items-center space-x-1 shadow-sm">
          <span>🛒</span>
          <span>查看顧客前台</span>
        </a>
        <button id="btn-logout" onclick="handleLogout()" class="hidden text-xs bg-red-600 hover:bg-red-700 px-3 py-1.5 rounded-lg text-white font-bold transition">登出系統</button>
      </div>
    </div>
  </header>
  <main class="max-w-6xl mx-auto px-4 py-8">

    <!-- 1. 登入區塊 -->
    <div id="admin-login-box" class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-xl border border-slate-200 mt-12">
      <div class="text-center mb-6">
        <span class="text-4xl">🔐</span>
        <h2 class="text-2xl font-bold text-slate-800 mt-2">管理員身分驗證</h2>
        <p class="text-sm text-slate-500">請輸入後台帳號密碼</p>
      </div>
      <form onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">帳號</label>
          <input type="text" id="login-user" value="farmer" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">密碼</label>
          <input type="password" id="login-pass" placeholder="預設 888888" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
        </div>
        <button type="submit" id="btn-login" class="w-full bg-slate-800 text-white font-bold py-2.5 rounded-lg hover:bg-slate-900 transition">登入系統</button>
      </form>
    </div>

    <!-- 2. 管理面板 (登入後顯示) -->
    <div id="admin-panel" class="hidden space-y-6">
      
      <!-- 分頁切換 -->
      <div class="flex space-x-2 border-b border-slate-200 pb-2">
        <button onclick="switchTab('fruits')" id="tab-btn-fruits" class="px-4 py-2 rounded-lg font-bold bg-emerald-600 text-white">🍎 水果商品管理</button>
        <button onclick="switchTab('orders')" id="tab-btn-orders" class="px-4 py-2 rounded-lg font-bold bg-white text-slate-600 hover:bg-slate-50">📋 訂單紀錄檢視</button>
      </div>

      <!-- 水果商品管理 -->
      <div id="panel-fruits" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-6">
        <div class="flex justify-between items-center">
          <h3 class="text-xl font-bold text-slate-800">水果商品清單設定</h3>
          <div class="space-x-2">
            <button onclick="addNewFruitRow()" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-sm font-bold">+ 新增水果品項</button>
            <button onclick="saveFruitsToBackend()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-sm font-bold shadow-sm">儲存全部更新</button>
          </div>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="border-b bg-slate-50 text-slate-600 text-sm">
                <th class="p-3">圖片</th>
                <th class="p-3">水果名稱</th>
                <th class="p-3">每斤單價 (元)</th>
                <th class="p-3">上架狀態</th>
                <th class="p-3">上傳/更換圖片</th>
              </tr>
            </thead>
            <tbody id="admin-fruit-table-body" class="divide-y text-sm"></tbody>
          </table>
        </div>
      </div>

      <!-- 訂單紀錄 -->
      <div id="panel-orders" class="hidden bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
        <div class="flex justify-between items-center">
          <h3 class="text-xl font-bold text-slate-800">最新訂單列表</h3>
          <button onclick="loadAdminOrders()" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg text-sm">🔄 重新整理</button>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="border-b bg-slate-50 text-slate-600 text-sm">
                <th class="p-3">訂單編號/時間</th>
                <th class="p-3">訂購人資訊</th>
                <th class="p-3">訂購品項</th>
                <th class="p-3">總金額</th>
                <th class="p-3">處理狀態</th>
              </tr>
            </thead>
            <tbody id="admin-order-table-body" class="divide-y text-sm"></tbody>
          </table>
        </div>
      </div>

    </div>

  </main>

  <script>
    // ⚠️ 貼上您的 GAS 部署網址
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxQsDLOyagMbYOOw-uYBozoZXRRq5fmEutsZCn0Q3DjtNjq9Uf10PQ7zMsXETsy0UKf/exec";

    let fruitsData = [];

    window.onload = function() {
      checkAuthStatus();
    };

    async function callGasApi(action, extraData = {}) {
      try {
        const payload = JSON.stringify({ action: action, ...extraData });
        const res = await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: payload
        });
        return await res.json();
      } catch (err) {
        console.error("API 呼叫失敗:", err);
        return { status: "error", message: "網路通訊失敗: " + err.message };
      }
    }

    function checkAuthStatus() {
      const isLoggedIn = sessionStorage.getItem("isFarmerLogin") === "true";
      document.getElementById('admin-login-box').classList.toggle('hidden', isLoggedIn);
      document.getElementById('admin-panel').classList.toggle('hidden', !isLoggedIn);
      document.getElementById('btn-logout').classList.toggle('hidden', !isLoggedIn);
      
      if (isLoggedIn) {
        loadFruits();
        loadAdminOrders();
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const user = document.getElementById('login-user').value;
      const pass = document.getElementById('login-pass').value;
      const btn = document.getElementById('btn-login');

      btn.disabled = true;
      btn.innerText = "驗證中...";

      const res = await callGasApi("checkLogin", { user: user, pass: pass });
      btn.disabled = false;
      btn.innerText = "登入系統";

      if (res && res.status === "success") {
        sessionStorage.setItem("isFarmerLogin", "true");
        checkAuthStatus();
      } else {
        alert(res ? res.message : "帳號或密碼錯誤");
      }
    }

    function handleLogout() {
      sessionStorage.removeItem("isFarmerLogin");
      checkAuthStatus();
    }

    function switchTab(tab) {
      document.getElementById('panel-fruits').classList.toggle('hidden', tab !== 'fruits');
      document.getElementById('panel-orders').classList.toggle('hidden', tab !== 'orders');

      document.getElementById('tab-btn-fruits').className = tab === 'fruits' ? "px-4 py-2 rounded-lg font-bold bg-emerald-600 text-white" : "px-4 py-2 rounded-lg font-bold bg-white text-slate-600 hover:bg-slate-50";
      document.getElementById('tab-btn-orders').className = tab === 'orders' ? "px-4 py-2 rounded-lg font-bold bg-emerald-600 text-white" : "px-4 py-2 rounded-lg font-bold bg-white text-slate-600 hover:bg-slate-50";
    }

    async function loadFruits() {
      const res = await callGasApi("getFruits");
      if (res && res.status === "success") {
        fruitsData = res.data;
        renderAdminFruits();
      }
    }

    function renderAdminFruits() {
      const tbody = document.getElementById('admin-fruit-table-body');
      tbody.innerHTML = fruitsData.map((f, idx) => `
        <tr data-id="${f.id}">
          <td class="p-3">
            <img id="img-preview-${idx}" src="${f.imageUrl || ''}" class="w-12 h-12 object-cover rounded-lg bg-slate-100 border">
          </td>
          <td class="p-3">
            <input type="text" value="${f.name}" onchange="fruitsData[${idx}].name=this.value" class="px-2 py-1 border rounded w-full">
          </td>
          <td class="p-3">
            <input type="number" value="${f.price}" onchange="fruitsData[${idx}].price=Number(this.value)" class="px-2 py-1 border rounded w-24">
          </td>
          <td class="p-3">
            <select onchange="fruitsData[${idx}].status=this.value" class="px-2 py-1 border rounded">
              <option value="ON" ${f.status === 'ON' ? 'selected' : ''}>上架 (ON)</option>
              <option value="OFF" ${f.status === 'OFF' ? 'selected' : ''}>下架 (OFF)</option>
            </select>
          </td>
          <td class="p-3">
            <input type="file" accept="image/*" onchange="uploadFruitImage(this, ${idx})" class="text-xs text-slate-500">
          </td>
        </tr>
      `).join('');
    }

    function addNewFruitRow() {
      fruitsData.push({
        id: "F" + (fruitsData.length + 1),
        name: "新品水果",
        price: 100,
        status: "ON",
        imageUrl: ""
      });
      renderAdminFruits();
    }

    function uploadFruitImage(fileInput, idx) {
      const file = fileInput.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async function(e) {
        const base64Data = e.target.result;
        
        const res = await callGasApi("uploadImage", { base64Data: base64Data, fileName: file.name });
        if (res.status === "success") {
          fruitsData[idx].imageUrl = res.url;
          document.getElementById(`img-preview-${idx}`).src = res.url;
          alert("圖片上傳成功！請記得點擊「儲存全部更新」");
        } else {
          alert("圖片上傳失敗：" + res.message);
        }
      };
      reader.readAsDataURL(file);
    }

    async function saveFruitsToBackend() {
      const res = await callGasApi("updateFruits", { fruits: fruitsData });
      if (res.status === "success") {
        alert(res.message);
        loadFruits();
      } else {
        alert("儲存失敗：" + res.message);
      }
    }

    async function loadAdminOrders() {
      const res = await callGasApi("getOrders");
      if (res && res.status === "success") {
        renderAdminOrders(res.data);
      }
    }

    function formatOrderItems(itemsStr) {
      try {
        const parsed = JSON.parse(itemsStr);
        if (typeof parsed === 'object' && parsed !== null) {
          const parts = [];
          for (let id in parsed) {
            const f = fruitsData.find(x => x.id === id);
            const name = f ? f.name : id;
            parts.push(`${name} x ${parsed[id]}斤`);
          }
          return parts.join(', ');
        }
      } catch (e) {}
      return itemsStr;
    }

    function renderAdminOrders(orders) {
      const tbody = document.getElementById('admin-order-table-body');
      if (orders.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-slate-400">尚無訂單資料</td></tr>`;
        return;
      }

      tbody.innerHTML = orders.map(o => `
        <tr class="hover:bg-slate-50">
          <td class="p-3">
            <div class="font-bold text-emerald-700">${o.orderId}</div>
            <div class="text-xs text-slate-400">${o.time}</div>
          </td>
          <td class="p-3">
            <div class="font-bold">${o.name} (${o.phone})</div>
            <div class="text-xs text-slate-500">${o.address}</div>
          </td>
          <td class="p-3 text-xs bg-slate-50 rounded">${formatOrderItems(o.items)}</td>
          <td class="p-3 font-bold text-emerald-600">$${o.totalAmount}</td>
          <td class="p-3">
            <select onchange="changeOrderStatus('${o.orderId}', this.value)" class="px-2 py-1 text-xs rounded border border-slate-300 bg-white font-bold text-slate-700 focus:outline-none focus:ring-2 focus:ring-emerald-500">
              <option value="待處理" ${o.status === '待處理' ? 'selected' : ''}>待處理</option>
              <option value="處理中" ${o.status === '處理中' ? 'selected' : ''}>處理中</option>
              <option value="已出貨" ${o.status === '已出貨' ? 'selected' : ''}>已出貨</option>
              <option value="已完成" ${o.status === '已完成' ? 'selected' : ''}>已完成</option>
              <option value="已取消" ${o.status === '已取消' ? 'selected' : ''}>已取消</option>
            </select>
          </td>
        </tr>
      `).join('');
    }

    async function changeOrderStatus(orderId, newStatus) {
      const res = await callGasApi("updateOrderStatus", { orderId: orderId, status: newStatus });
      if (res.status === "success") {
        alert("訂單 " + orderId + " 狀態已更新為：" + newStatus);
      } else {
        alert("更新狀態失敗：" + res.message);
        loadAdminOrders();
      }
    }
  </script>
</body>
</html>
