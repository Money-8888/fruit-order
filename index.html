<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>阿咘奶粉錢｜產地新鮮水果直送</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    html { scroll-behavior: smooth; }
  </style>
</head>
<body class="bg-stone-50 min-h-screen font-sans text-slate-800 pb-24">

  <!-- 頂部導覽列 -->
  <header class="bg-emerald-700 text-white shadow-md sticky top-0 z-40">
    <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <span class="text-2xl">👨‍🌾</span>
        <div>
          <h1 class="text-base sm:text-lg font-bold tracking-wide leading-tight">阿咘奶粉錢</h1>
          <p class="text-[11px] text-emerald-100">產地現採・新鮮直送</p>
        </div>
      </div>

      <div class="flex items-center space-x-2">
        <button onclick="openMemberModal()" id="nav-member-btn" class="text-xs bg-emerald-800 hover:bg-emerald-900 px-3 py-1.5 rounded-full font-bold transition flex items-center space-x-1 border border-emerald-600">
          <span>👤</span>
          <span id="nav-member-text">會員登入</span>
        </button>
        <button onclick="openCartModal()" class="text-xs bg-amber-400 hover:bg-amber-500 text-slate-900 px-3 py-1.5 rounded-full font-bold transition flex items-center space-x-1 shadow">
          <span>🛒</span>
          <span id="nav-cart-count">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 1. 首頁頂部「果園現況精選輪播看板」 -->
  <section class="max-w-5xl mx-auto sm:px-4 sm:pt-4">
    <div id="hero-carousel" class="relative w-full aspect-[4/3] sm:aspect-[16/9] max-h-[460px] bg-slate-900 sm:rounded-2xl overflow-hidden shadow-lg select-none">
      <!-- 輪播圖片容器 -->
      <div id="carousel-track" class="w-full h-full relative">
        <div class="w-full h-full flex flex-col items-center justify-center text-white/80 space-y-2 bg-gradient-to-br from-emerald-800 to-emerald-950">
          <span class="text-4xl animate-bounce">🌿</span>
          <p class="text-sm font-bold">正在載入果園最新現況...</p>
        </div>
      </div>

      <!-- 左右切換箭頭 -->
      <button id="carousel-prev" onclick="prevSlide()" class="hidden absolute left-2.5 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full bg-black/45 hover:bg-black/70 text-white flex items-center justify-center backdrop-blur-sm transition z-10">
        ❮
      </button>
      <button id="carousel-next" onclick="nextSlide()" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full bg-black/45 hover:bg-black/70 text-white flex items-center justify-center backdrop-blur-sm transition z-10">
        ❯
      </button>

      <!-- 底部指示點 -->
      <div id="carousel-dots" class="absolute bottom-3 left-1/2 -translate-x-1/2 flex items-center space-x-1.5 z-10"></div>
    </div>
  </section>

  <!-- 訂購與生鮮須知提示條 -->
  <section class="max-w-5xl mx-auto px-3 sm:px-4 mt-4">
    <div class="bg-amber-50 border border-amber-200 rounded-2xl p-3.5 text-xs text-amber-900 flex items-start gap-2.5 shadow-sm">
      <span class="text-lg leading-none">📢</span>
      <div class="space-y-1">
        <p class="font-bold">產地新鮮採收說明：</p>
        <p class="text-amber-800/90 leading-relaxed">下單後請於 48 小時內完成匯款並備註帳號後 5 碼；鮮果依採收順序安排出貨，送達後請於 24 小時內開箱檢查並冷藏保存。</p>
      </div>
    </div>
  </section>

  <!-- 2. 當季鮮果訂購列表 -->
  <main class="max-w-5xl mx-auto px-3 sm:px-4 mt-5">
    <div class="flex items-center justify-between mb-3">
      <h2 class="text-lg font-bold text-slate-800 flex items-center gap-1.5">
        <span>🍎</span>
        <span>當季鮮果直購</span>
      </h2>
      <span class="text-xs text-slate-400">點擊縮圖可查看多角度現況</span>
    </div>

    <div id="fruit-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
      <div class="col-span-full text-center py-12 text-slate-400">載入水果清單中...</div>
    </div>
  </main>

  <!-- 底部懸浮購物車結帳列 -->
  <div id="bottom-cart-bar" class="hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 shadow-[0_-4px_12px_rgba(0,0,0,0.08)] p-3 z-40">
    <div class="max-w-5xl mx-auto flex items-center justify-between gap-3">
      <div>
        <div class="text-xs text-slate-500">已選購 <span id="bar-total-qty" class="font-bold text-emerald-700">0</span> 斤鮮果</div>
        <div class="text-lg font-extrabold text-emerald-700">合計：$<span id="bar-total-amount">0</span> 元</div>
      </div>
      <button onclick="openCartModal()" class="bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-bold px-6 py-2.5 rounded-xl shadow-md transition text-sm">
        前往結帳 ➔
      </button>
    </div>
  </div>

  <!-- 3. 購物車與結帳 Modal -->
  <div id="cart-modal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-xs flex items-end sm:items-center justify-center z-50">
    <div class="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-2xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
      <div class="p-4 border-b flex justify-between items-center bg-slate-50">
        <h3 class="font-bold text-lg text-slate-800">🛒 購物車與收件資料</h3>
        <button onclick="closeCartModal()" class="text-slate-400 hover:text-slate-700 text-2xl font-bold leading-none">&times;</button>
      </div>

      <div class="p-4 overflow-y-auto space-y-4 flex-1">
        <!-- 購物車明細 -->
        <div id="cart-items-list" class="space-y-2"></div>

        <div class="flex justify-between items-center bg-emerald-50 p-3 rounded-xl border border-emerald-100">
          <span class="font-bold text-sm text-emerald-900">訂單總金額</span>
          <span class="font-extrabold text-lg text-emerald-700">$<span id="modal-total-amount">0</span> 元</span>
        </div>

        <!-- 收件人表單 -->
        <form id="checkout-form" onsubmit="submitOrder(event)" class="space-y-3 pt-1">
          <div class="flex justify-between items-center">
            <h4 class="font-bold text-sm text-slate-700">📦 收件配送資訊</h4>
            <span id="member-autofill-badge" class="hidden text-[11px] bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-bold">已自動帶入會員資料</span>
          </div>

          <div class="grid grid-cols-2 gap-2.5">
            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">收件人姓名 *</label>
              <input type="text" id="order-name" required placeholder="王小明" class="w-full px-3 py-2 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">聯絡手機 *</label>
              <input type="tel" id="order-phone" required placeholder="0912345678" class="w-full px-3 py-2 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">電子信箱 Email（接收出貨與物流單號通知）*</label>
            <input type="email" id="order-email" required placeholder="example@gmail.com" class="w-full px-3 py-2 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-emerald-500">
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">宅配收件地址 *</label>
            <input type="text" id="order-address" required placeholder="請填寫完整縣市與地址" class="w-full px-3 py-2 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-emerald-500">
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">付款備註 / 帳號後 5 碼 / 配送時段</label>
            <input type="text" id="order-note" placeholder="例如：已轉帳後5碼 12345、希望上午到貨" class="w-full px-3 py-2 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-emerald-500">
          </div>

          <button type="submit" id="btn-submit-order" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-md transition text-base">
            ✅ 確認送出訂單
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- 4. 會員中心 Modal (登入 / 註冊 / 忘記密碼 / 歷史訂單與物流追蹤) -->
  <div id="member-modal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-xs flex items-end sm:items-center justify-center z-50">
    <div class="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-2xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
      <div class="p-4 border-b flex justify-between items-center bg-slate-50">
        <h3 class="font-bold text-lg text-slate-800">👤 會員中心</h3>
        <button onclick="closeMemberModal()" class="text-slate-400 hover:text-slate-700 text-2xl font-bold leading-none">&times;</button>
      </div>

      <div class="p-4 overflow-y-auto flex-1">
        <!-- 未登入視圖 -->
        <div id="member-guest-view" class="space-y-4">
          <div class="grid grid-cols-3 gap-1 bg-slate-100 p-1 rounded-xl text-xs font-bold">
            <button onclick="switchMemberAuthTab('login')" id="auth-tab-login" class="py-2 rounded-lg bg-white text-emerald-700 shadow-xs">會員登入</button>
            <button onclick="switchMemberAuthTab('register')" id="auth-tab-register" class="py-2 rounded-lg text-slate-500">免費註冊</button>
            <button onclick="switchMemberAuthTab('forgot')" id="auth-tab-forgot" class="py-2 rounded-lg text-slate-500">忘記密碼</button>
          </div>

          <!-- 登入表單 -->
          <form id="member-login-form" onsubmit="handleMemberLogin(event)" class="space-y-3">
            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">帳號 或 手機號碼</label>
              <input type="text" id="m-login-key" required placeholder="請輸入帳號或 09xx手機" class="w-full px-3 py-2 border rounded-xl text-sm">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">密碼</label>
              <input type="password" id="m-login-pass" required placeholder="請輸入密碼" class="w-full px-3 py-2 border rounded-xl text-sm">
            </div>
            <button type="submit" class="w-full bg-emerald-600 text-white font-bold py-2.5 rounded-xl text-sm shadow">登入會員</button>
          </form>

          <!-- 註冊表單 -->
          <form id="member-register-form" onsubmit="handleMemberRegister(event)" class="hidden space-y-2.5">
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">設定帳號 *</label>
                <input type="text" id="m-reg-acc" required placeholder="英文或數字" class="w-full px-3 py-2 border rounded-xl text-sm">
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">設定密碼 *</label>
                <input type="password" id="m-reg-pass" required placeholder="請設定密碼" class="w-full px-3 py-2 border rounded-xl text-sm">
              </div>
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">真實姓名 *</label>
                <input type="text" id="m-reg-name" required placeholder="王小明" class="w-full px-3 py-2 border rounded-xl text-sm">
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">手機號碼 *</label>
                <input type="tel" id="m-reg-phone" required placeholder="0912345678" class="w-full px-3 py-2 border rounded-xl text-sm">
              </div>
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">電子信箱 Email *</label>
              <input type="email" id="m-reg-email" required placeholder="用於接收通知與密碼查詢" class="w-full px-3 py-2 border rounded-xl text-sm">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">預設配送地址</label>
              <input type="text" id="m-reg-addr" placeholder="填寫後結帳免重打" class="w-full px-3 py-2 border rounded-xl text-sm">
            </div>
            <button type="submit" class="w-full bg-emerald-600 text-white font-bold py-2.5 rounded-xl text-sm shadow">立即註冊</button>
          </form>

          <!-- 忘記密碼表單 -->
          <form id="member-forgot-form" onsubmit="handleMemberForgot(event)" class="hidden space-y-3">
            <p class="text-xs text-slate-500">請輸入註冊時的帳號、手機與 Email 進行身分驗證：</p>
            <input type="text" id="m-fg-acc" required placeholder="註冊帳號" class="w-full px-3 py-2 border rounded-xl text-sm">
            <input type="tel" id="m-fg-phone" required placeholder="註冊手機號碼" class="w-full px-3 py-2 border rounded-xl text-sm">
            <input type="email" id="m-fg-email" required placeholder="註冊 Email" class="w-full px-3 py-2 border rounded-xl text-sm">
            <button type="submit" class="w-full bg-slate-800 text-white font-bold py-2.5 rounded-xl text-sm">查詢密碼</button>
          </form>
        </div>

        <!-- 已登入視圖 -->
        <div id="member-logged-view" class="hidden space-y-4">
          <div class="bg-emerald-50 border border-emerald-200 rounded-2xl p-3 flex justify-between items-center">
            <div>
              <div class="font-bold text-emerald-900 text-sm" id="logged-member-info">歡迎回來</div>
              <div class="text-xs text-emerald-700" id="logged-member-sub"></div>
            </div>
            <button onclick="handleMemberLogout()" class="text-xs bg-white border border-red-200 text-red-600 px-3 py-1.5 rounded-lg font-bold">登出</button>
          </div>

          <div>
            <div class="flex justify-between items-center mb-2">
              <h4 class="font-bold text-sm text-slate-700">📋 歷史訂單與物流追蹤</h4>
              <button onclick="loadMemberOrderHistory()" class="text-xs text-emerald-700 font-bold">🔄 重新整理</button>
            </div>
            <div id="member-orders-list" class="space-y-3">
              <div class="text-center py-6 text-xs text-slate-400">載入歷史訂單中...</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxQsDLOyagMbYOOw-uYBozoZXRRq5fmEutsZCn0Q3DjtNjq9Uf10PQ7zMsXETsy0UKf/exec";

    let fruitsData = [];
    let carouselSlides = [];
    let currentSlideIdx = 0;
    let carouselTimer = null;
    let touchStartX = 0;

    let cart = {}; // { fruitId: qty }
    let currentMember = null;

    window.onload = function() {
      restoreMemberSession();
      loadStoreData();
    };

    async function callGasApi(action, extraData = {}) {
      try {
        const res = await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: action, ...extraData })
        });
        return await res.json();
      } catch (err) {
        console.error("API 錯誤:", err);
        return { status: "error", message: "網路連線失敗：" + err.message };
      }
    }

    // ------------------- 1. 載入商品與首頁現況輪播 -------------------

    async function loadStoreData() {
      const res = await callGasApi("getFruits");
      if (res && res.status === "success") {
        fruitsData = (res.data || []).filter(f => f.status === "ON");
        carouselSlides = res.carouselSlides || [];

        // 若後台尚未勾選任何輪播圖，預設使用上架水果封面圖作為輪播備援
        if (carouselSlides.length === 0) {
          fruitsData.forEach(f => {
            const firstUrl = (f.imageUrl || "").split(",")[0].trim();
            if (firstUrl) {
              carouselSlides.push({
                url: firstUrl,
                caption: "產地新鮮採收直送",
                fruitId: f.id,
                fruitName: f.name,
                price: f.price
              });
            }
          });
        }

        renderHeroCarousel();
        renderFruitsGrid();
      }
    }

    function renderHeroCarousel() {
      const track = document.getElementById("carousel-track");
      const dots = document.getElementById("carousel-dots");
      const prevBtn = document.getElementById("carousel-prev");
      const nextBtn = document.getElementById("carousel-next");

      if (carouselSlides.length === 0) {
        track.innerHTML = `
          <div class="w-full h-full flex flex-col items-center justify-center text-white p-6 text-center bg-gradient-to-br from-emerald-700 to-emerald-900">
            <span class="text-4xl mb-2">🍉</span>
            <h2 class="text-xl font-bold">阿咘奶粉錢｜產地新鮮水果直送</h2>
            <p class="text-xs text-emerald-100 mt-1">每日清晨新鮮採收，嚴選甜度與品質</p>
          </div>`;
        return;
      }

      if (carouselSlides.length > 1) {
        prevBtn.classList.remove("hidden");
        nextBtn.classList.remove("hidden");
      }

      track.innerHTML = carouselSlides.map((slide, i) => `
        <div onclick="scrollToFruit('${slide.fruitId}')" 
             class="carousel-slide absolute inset-0 transition-opacity duration-500 cursor-pointer ${i === 0 ? 'opacity-100 z-[1]' : 'opacity-0 pointer-events-none'}"
             data-slide-idx="${i}">
          
          <!-- 底層：同張照片放大模糊填滿兩側，避免直式照片出現黑邊 -->
          <img src="${slide.url}" referrerpolicy="no-referrer" aria-hidden="true" class="absolute inset-0 w-full h-full object-cover blur-xl scale-110 opacity-55">
          
          <!-- 前景：完整顯示整張水果實拍，完全不被裁切 -->
          <img src="${slide.url}" referrerpolicy="no-referrer" class="relative w-full h-full object-contain z-[1]">
          
          <!-- 漸層遮罩確保文字清晰 -->
          <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-black/20 z-[2]"></div>
          
          <!-- 左上角現況實拍標籤 -->
          <div class="absolute top-3 left-3 bg-black/60 backdrop-blur-md text-white text-xs font-bold px-3 py-1.5 rounded-full border border-white/20 flex items-center gap-1.5 shadow z-[3]">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            <span>${slide.caption}</span>
          </div>

          <!-- 左下角水果名稱與價格引導 -->
          <div class="absolute bottom-8 left-4 right-4 text-white flex justify-between items-end z-[3]">
            <div>
              <div class="text-lg sm:text-2xl font-extrabold drop-shadow">${slide.fruitName}</div>
              <div class="text-xs sm:text-sm text-emerald-300 font-bold">$${slide.price} 元 / 斤</div>
            </div>
            <span class="bg-emerald-600/90 text-white text-xs font-bold px-3 py-1.5 rounded-full shadow">
              立即選購 ↓
            </span>
          </div>
        </div>
      `).join('');

      dots.innerHTML = carouselSlides.map((_, i) => `
        <button onclick="goToSlide(${i})" class="carousel-dot h-2 rounded-full transition-all ${i === 0 ? 'w-6 bg-emerald-400' : 'w-2 bg-white/60'}"></button>
      `).join('');

      setupCarouselTouch();
      startCarouselAutoPlay();
    }

    function updateSlideView() {
      const slides = document.querySelectorAll(".carousel-slide");
      const dots = document.querySelectorAll(".carousel-dot");

      slides.forEach((el, i) => {
        if (i === currentSlideIdx) {
          el.classList.remove("opacity-0", "pointer-events-none");
          el.classList.add("opacity-100", "z-[1]");
        } else {
          el.classList.remove("opacity-100", "z-[1]");
          el.classList.add("opacity-0", "pointer-events-none");
        }
      });

      dots.forEach((dot, i) => {
        dot.className = i === currentSlideIdx
          ? "carousel-dot h-2 w-6 rounded-full bg-emerald-400 transition-all"
          : "carousel-dot h-2 w-2 rounded-full bg-white/60 transition-all";
      });
    }

    function nextSlide() {
      if (carouselSlides.length <= 1) return;
      currentSlideIdx = (currentSlideIdx + 1) % carouselSlides.length;
      updateSlideView();
      startCarouselAutoPlay();
    }

    function prevSlide() {
      if (carouselSlides.length <= 1) return;
      currentSlideIdx = (currentSlideIdx - 1 + carouselSlides.length) % carouselSlides.length;
      updateSlideView();
      startCarouselAutoPlay();
    }

    function goToSlide(idx) {
      currentSlideIdx = idx;
      updateSlideView();
      startCarouselAutoPlay();
    }

    function startCarouselAutoPlay() {
      if (carouselTimer) clearInterval(carouselTimer);
      if (carouselSlides.length > 1) {
        carouselTimer = setInterval(() => {
          currentSlideIdx = (currentSlideIdx + 1) % carouselSlides.length;
          updateSlideView();
        }, 4500);
      }
    }

    function setupCarouselTouch() {
      const hero = document.getElementById("hero-carousel");
      hero.ontouchstart = e => { touchStartX = e.changedTouches[0].screenX; };
      hero.ontouchend = e => {
        const diff = e.changedTouches[0].screenX - touchStartX;
        if (Math.abs(diff) > 40) {
          diff < 0 ? nextSlide() : prevSlide();
        }
      };
    }

    function scrollToFruit(fruitId) {
      const card = document.getElementById(`fruit-card-${fruitId}`);
      if (card) {
        card.scrollIntoView({ behavior: "smooth", block: "center" });
        card.classList.add("ring-4", "ring-emerald-400");
        setTimeout(() => card.classList.remove("ring-4", "ring-emerald-400"), 1800);
      }
    }

    // ------------------- 2. 水果商品卡片與手動縮圖切換 -------------------

    function renderFruitsGrid() {
      const grid = document.getElementById("fruit-grid");
      if (fruitsData.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400">目前尚無上架中的水果</div>`;
        return;
      }

      grid.innerHTML = fruitsData.map(f => {
        const items = (f.carouselItems && f.carouselItems.length > 0)
          ? f.carouselItems
          : (f.imageUrl ? f.imageUrl.split(",").map(u => ({ url: u.trim(), caption: "" })).filter(x => x.url) : []);

        const coverUrl = items.length > 0 ? items[0].url : "";
        const coverCaption = items.length > 0 ? items[0].caption : "";
        const isSoldOut = f.stock <= 0;

        return `
        <div id="fruit-card-${f.id}" class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden flex flex-col transition-all duration-300">
          <!-- 主圖展示區 -->
          <div class="relative w-full h-56 bg-slate-100">
            ${coverUrl ? `
              <img id="main-img-${f.id}" src="${coverUrl}" referrerpolicy="no-referrer" class="w-full h-full object-cover">
            ` : `
              <div class="w-full h-full flex items-center justify-center text-slate-400 text-sm font-bold">尚無圖片</div>
            `}

            <span id="main-cap-${f.id}" class="${coverCaption ? '' : 'hidden'} absolute bottom-2 left-2 bg-black/65 text-white text-[11px] font-bold px-2.5 py-1 rounded-full backdrop-blur-xs">
              ${coverCaption}
            </span>

            <span class="absolute top-2.5 right-2.5 text-xs font-bold px-2.5 py-1 rounded-full shadow ${isSoldOut ? 'bg-red-600 text-white' : 'bg-white/90 text-emerald-800'}">
              ${isSoldOut ? '已售完' : `剩餘 ${f.stock} 斤`}
            </span>
          </div>

          <!-- 多圖手動切換縮圖列 -->
          ${items.length > 1 ? `
            <div class="flex items-center gap-1.5 px-3 pt-2.5 overflow-x-auto no-scrollbar">
              ${items.map((it, idx) => `
                <button type="button" 
                        onclick="selectCardPhoto('${f.id}', '${it.url}', '${(it.caption || '').replace(/'/g, "\\'")}', this)"
                        class="thumb-btn-${f.id} w-12 h-12 rounded-lg overflow-hidden border-2 flex-shrink-0 transition ${idx === 0 ? 'border-emerald-600' : 'border-transparent opacity-70 hover:opacity-100'}">
                  <img src="${it.url}" referrerpolicy="no-referrer" class="w-full h-full object-cover">
                </button>
              `).join('')}
            </div>
          ` : ''}

          <!-- 商品文字與下單區 -->
          <div class="p-4 flex-1 flex flex-col justify-between space-y-3">
            <div>
              <div class="flex justify-between items-start gap-2">
                <h3 class="font-bold text-lg text-slate-800">${f.name}</h3>
                <div class="text-emerald-700 font-extrabold text-lg whitespace-nowrap">$${f.price}<span class="text-xs font-normal text-slate-500"> /斤</span></div>
              </div>
              <p class="text-xs text-slate-500 mt-1.5 leading-relaxed">${f.description || '產地新鮮現採，甜美多汁。'}</p>
            </div>

            <div class="pt-2 border-t border-slate-100 flex items-center gap-2">
              <div class="flex items-center border border-slate-300 rounded-xl overflow-hidden bg-slate-50">
                <button type="button" onclick="changeCardQty('${f.id}', -1)" class="px-3 py-2 text-slate-600 font-bold hover:bg-slate-200">-</button>
                <input type="number" id="qty-input-${f.id}" value="1" min="1" max="${f.stock}" class="w-12 text-center bg-transparent text-sm font-bold outline-none">
                <button type="button" onclick="changeCardQty('${f.id}', 1, ${f.stock})" class="px-3 py-2 text-slate-600 font-bold hover:bg-slate-200">+</button>
              </div>

              <button type="button" 
                      ${isSoldOut ? 'disabled' : ''}
                      onclick="addToCart('${f.id}')" 
                      class="flex-1 py-2.5 rounded-xl font-bold text-sm transition shadow-xs ${
                        isSoldOut 
                          ? 'bg-slate-200 text-slate-400 cursor-not-allowed' 
                          : 'bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white'
                      }">
                ${isSoldOut ? '補貨中' : '加入購物車'}
              </button>
            </div>
          </div>
        </div>
        `;
      }).join('');
    }

    function selectCardPhoto(fruitId, url, caption, btnEl) {
      const mainImg = document.getElementById(`main-img-${fruitId}`);
      const mainCap = document.getElementById(`main-cap-${fruitId}`);
      if (mainImg) mainImg.src = url;
      if (mainCap) {
        if (caption) {
          mainCap.innerText = caption;
          mainCap.classList.remove("hidden");
        } else {
          mainCap.classList.add("hidden");
        }
      }

      document.querySelectorAll(`.thumb-btn-${fruitId}`).forEach(b => {
        b.classList.remove("border-emerald-600");
        b.classList.add("border-transparent", "opacity-70");
      });
      btnEl.classList.remove("border-transparent", "opacity-70");
      btnEl.classList.add("border-emerald-600");
    }

    function changeCardQty(fruitId, delta, maxStock = 999) {
      const input = document.getElementById(`qty-input-${fruitId}`);
      if (!input) return;
      let val = (parseInt(input.value, 10) || 1) + delta;
      if (val < 1) val = 1;
      if (maxStock > 0 && val > maxStock) val = maxStock;
      input.value = val;
    }

    // ------------------- 3. 購物車與結帳 -------------------

    function addToCart(fruitId) {
      const fruit = fruitsData.find(f => f.id === fruitId);
      if (!fruit) return;

      const input = document.getElementById(`qty-input-${fruitId}`);
      const addQty = parseInt(input ? input.value : 1, 10) || 1;

      const currentQty = cart[fruitId] || 0;
      if (currentQty + addQty > fruit.stock) {
        alert(`抱歉，「${fruit.name}」目前僅剩 ${fruit.stock} 斤！`);
        return;
      }

      cart[fruitId] = currentQty + addQty;
      updateCartUI();
    }

    function updateCartUI() {
      let totalQty = 0;
      let totalAmount = 0;

      for (let id in cart) {
        const f = fruitsData.find(x => x.id === id);
        if (f && cart[id] > 0) {
          totalQty += cart[id];
          totalAmount += f.price * cart[id];
        }
      }

      document.getElementById("nav-cart-count").innerText = totalQty;
      document.getElementById("bar-total-qty").innerText = totalQty;
      document.getElementById("bar-total-amount").innerText = totalAmount;
      document.getElementById("modal-total-amount").innerText = totalAmount;

      const bar = document.getElementById("bottom-cart-bar");
      if (totalQty > 0) {
        bar.classList.remove("hidden");
      } else {
        bar.classList.add("hidden");
      }
    }

    function openCartModal() {
      const listEl = document.getElementById("cart-items-list");
      const ids = Object.keys(cart).filter(id => cart[id] > 0);

      if (ids.length === 0) {
        alert("購物車目前是空的，請先選購水果！");
        return;
      }

      listEl.innerHTML = ids.map(id => {
        const f = fruitsData.find(x => x.id === id);
        if (!f) return "";
        return `
          <div class="flex items-center justify-between bg-slate-50 p-2.5 rounded-xl border border-slate-200 text-sm">
            <div>
              <div class="font-bold text-slate-800">${f.name}</div>
              <div class="text-xs text-slate-500">$${f.price} / 斤</div>
            </div>
            <div class="flex items-center gap-2">
              <button type="button" onclick="adjustCartItem('${id}', -1)" class="w-7 h-7 rounded-lg bg-white border font-bold text-slate-600">-</button>
              <span class="font-bold w-8 text-center">${cart[id]}斤</span>
              <button type="button" onclick="adjustCartItem('${id}', 1)" class="w-7 h-7 rounded-lg bg-white border font-bold text-slate-600">+</button>
            </div>
          </div>
        `;
      }).join('');

      if (currentMember) {
        document.getElementById("order-name").value = currentMember.name || "";
        document.getElementById("order-phone").value = currentMember.phone || "";
        document.getElementById("order-email").value = currentMember.email || "";
        document.getElementById("order-address").value = currentMember.address || "";
        document.getElementById("member-autofill-badge").classList.remove("hidden");
      }

      document.getElementById("cart-modal").classList.remove("hidden");
    }

    function closeCartModal() {
      document.getElementById("cart-modal").classList.add("hidden");
    }

    function adjustCartItem(id, delta) {
      const f = fruitsData.find(x => x.id === id);
      if (!f) return;
      const next = (cart[id] || 0) + delta;
      if (next <= 0) {
        delete cart[id];
      } else if (next <= f.stock) {
        cart[id] = next;
      }
      updateCartUI();
      if (Object.keys(cart).length === 0) {
        closeCartModal();
      } else {
        openCartModal();
      }
    }

    async function submitOrder(e) {
      e.preventDefault();
      const btn = document.getElementById("btn-submit-order");
      btn.disabled = true;
      btn.innerText = "⏳ 訂單傳送中...";

      let totalAmount = 0;
      const summaryParts = [];
      for (let id in cart) {
        const f = fruitsData.find(x => x.id === id);
        if (f && cart[id] > 0) {
          totalAmount += f.price * cart[id];
          summaryParts.push(`${f.name} x ${cart[id]}斤`);
        }
      }

      const payload = {
        name: document.getElementById("order-name").value.trim(),
        phone: document.getElementById("order-phone").value.trim(),
        email: document.getElementById("order-email").value.trim(),
        address: document.getElementById("order-address").value.trim(),
        note: document.getElementById("order-note").value.trim(),
        items: summaryParts.join(", "),
        totalAmount: totalAmount
      };

      const res = await callGasApi("createOrder", payload);
      btn.disabled = false;
      btn.innerText = "✅ 確認送出訂單";

      if (res && res.status === "success") {
        alert(`🎉 訂購成功！\n訂單編號：${res.orderId}\n總金額：$${totalAmount} 元\n\n請於 48 小時內完成匯款，農夫確認收款與出貨後將寄信通知您！`);
        cart = {};
        updateCartUI();
        closeCartModal();
      } else {
        alert("訂單建立失敗：" + (res ? res.message : "未知錯誤"));
      }
    }

    // ------------------- 4. 會員系統與歷史訂單追蹤 -------------------

    function restoreMemberSession() {
      const saved = localStorage.getItem("fruit_member_user");
      if (saved) {
        try {
          currentMember = JSON.parse(saved);
          updateMemberHeader();
        } catch (e) {}
      }
    }

    function updateMemberHeader() {
      const textEl = document.getElementById("nav-member-text");
      if (currentMember) {
        textEl.innerText = currentMember.name || currentMember.account;
      } else {
        textEl.innerText = "會員登入";
      }
    }

    function openMemberModal() {
      document.getElementById("member-modal").classList.remove("hidden");
      if (currentMember) {
        document.getElementById("member-guest-view").classList.add("hidden");
        document.getElementById("member-logged-view").classList.remove("hidden");
        document.getElementById("logged-member-info").innerText = `👋 您好，${currentMember.name}（${currentMember.account}）`;
        document.getElementById("logged-member-sub").innerText = `手機：${currentMember.phone}｜Email：${currentMember.email}`;
        loadMemberOrderHistory();
      } else {
        document.getElementById("member-guest-view").classList.remove("hidden");
        document.getElementById("member-logged-view").classList.add("hidden");
      }
    }

    function closeMemberModal() {
      document.getElementById("member-modal").classList.add("hidden");
    }

    function switchMemberAuthTab(tab) {
      ["login", "register", "forgot"].forEach(t => {
        document.getElementById(`member-${t}-form`).classList.toggle("hidden", t !== tab);
        document.getElementById(`auth-tab-${t}`).className = t === tab
          ? "py-2 rounded-lg bg-white text-emerald-700 shadow-xs"
          : "py-2 rounded-lg text-slate-500";
      });
    }

    async function handleMemberLogin(e) {
      e.preventDefault();
      const key = document.getElementById("m-login-key").value.trim();
      const pass = document.getElementById("m-login-pass").value.trim();

      const res = await callGasApi("login", { account: key, password: pass });
      if (res && res.status === "success") {
        currentMember = res.user;
        localStorage.setItem("fruit_member_user", JSON.stringify(currentMember));
        updateMemberHeader();
        openMemberModal();
      } else {
        alert(res ? res.message : "登入失敗");
      }
    }

    async function handleMemberRegister(e) {
      e.preventDefault();
      const payload = {
        account: document.getElementById("m-reg-acc").value.trim(),
        password: document.getElementById("m-reg-pass").value.trim(),
        name: document.getElementById("m-reg-name").value.trim(),
        phone: document.getElementById("m-reg-phone").value.trim(),
        email: document.getElementById("m-reg-email").value.trim(),
        address: document.getElementById("m-reg-addr").value.trim()
      };

      const res = await callGasApi("register", payload);
      if (res && res.status === "success") {
        alert("註冊成功！請使用剛設定的帳號密碼登入。");
        switchMemberAuthTab("login");
      } else {
        alert(res ? res.message : "註冊失敗");
      }
    }

    async function handleMemberForgot(e) {
      e.preventDefault();
      const payload = {
        account: document.getElementById("m-fg-acc").value.trim(),
        phone: document.getElementById("m-fg-phone").value.trim(),
        email: document.getElementById("m-fg-email").value.trim()
      };

      const res = await callGasApi("forgotPassword", payload);
      if (res && res.status === "success") {
        alert(`✅ 身分驗證通過！您的密碼為：${res.password}`);
        switchMemberAuthTab("login");
      } else {
        alert(res ? res.message : "驗證失敗");
      }
    }

    function handleMemberLogout() {
      currentMember = null;
      localStorage.removeItem("fruit_member_user");
      updateMemberHeader();
      openMemberModal();
    }

    async function loadMemberOrderHistory() {
      if (!currentMember) return;
      const listEl = document.getElementById("member-orders-list");
      listEl.innerHTML = `<div class="text-center py-6 text-xs text-slate-400">讀取歷史訂單中...</div>`;

      const res = await callGasApi("getMemberOrders", { phone: currentMember.phone });
      if (res && res.status === "success") {
        const orders = res.data || [];
        if (orders.length === 0) {
          listEl.innerHTML = `<div class="text-center py-6 text-xs text-slate-400 bg-slate-50 rounded-xl">尚無歷史訂單紀錄</div>`;
          return;
        }

        listEl.innerHTML = orders.map(o => `
          <div class="bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs space-y-1.5">
            <div class="flex justify-between items-center border-b pb-1.5">
              <span class="font-bold text-emerald-700">${o.orderId}</span>
              <span class="px-2 py-0.5 rounded bg-white border font-bold text-slate-700">${o.status}</span>
            </div>
            <div class="text-slate-600">📦 ${o.items}</div>
            <div class="flex justify-between items-center text-slate-500">
              <span>💰 付款狀態：<b class="${o.paymentStatus === '已收款' ? 'text-emerald-600' : 'text-amber-600'}">${o.paymentStatus}</b></span>
              <span class="font-bold text-slate-800">$${o.totalAmount} 元</span>
            </div>
            ${o.trackingNumber ? `
              <div class="bg-blue-50 text-blue-800 border border-blue-200 px-2.5 py-1.5 rounded-lg font-bold">
                🚚 物流單號：${o.trackingNumber}
              </div>
            ` : ''}
          </div>
        `).join('');
      }
    }
  </script>
</body>
</html>
