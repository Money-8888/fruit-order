<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>阿咘奶粉錢 - 線上訂購網</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-emerald-50/50 min-h-screen font-sans text-slate-800">

  <!-- 頂部導覽列 -->
  <header class="bg-emerald-600 text-white shadow-md sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <span class="text-2xl">🍎</span>
        <h1 class="text-xl font-bold tracking-wide">阿咘奶粉錢鮮果嚴選直銷網</h1>
      </div>
      <span class="text-xs bg-emerald-700 px-3 py-1 rounded-full text-emerald-100">產地直送 ‧ 新鮮保證</span>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8 space-y-8">
    <div class="text-center max-w-2xl mx-auto">
      <h2 class="text-3xl font-extrabold text-emerald-900 mb-2">新鮮水果，輕鬆訂購</h2>
      <p class="text-slate-600">挑選您喜愛的水果，填妥配送資料後即可完成訂購！</p>
    </div>

    <!-- 水果品項清單 -->
    <div id="shop-fruit-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <div class="col-span-full text-center py-12 text-slate-400">正在載入最新水果清單...</div>
    </div>

    <!-- 訂購資料表單 -->
    <div class="bg-white rounded-2xl shadow-lg p-6 max-w-2xl mx-auto border border-emerald-100">
      <h3 class="text-xl font-bold text-slate-800 border-b pb-3 mb-4 flex items-center">
        <span class="mr-2">📝</span> 填寫訂購資料
      </h3>
      
      <form id="order-form" onsubmit="submitOrder(event)" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">已選購品項與金額</label>
          <div id="cart-summary" class="bg-slate-50 p-4 rounded-xl border border-slate-200 text-sm text-slate-600 min-h-[60px]">
            尚未選擇任何水果
          </div>
          <div class="text-right text-lg font-bold text-emerald-600 mt-2">
            總金額：$<span id="cart-total">0</span> 元
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">姓名 *</label>
            <input type="text" id="cust-name" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">電話 *</label>
            <input type="tel" id="cust-phone" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
            <input type="email" id="cust-email" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">配送地址 *</label>
            <input type="text" id="cust-address" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">備註說明</label>
          <textarea id="cust-note" rows="2" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="例如：方便收貨時間..."></textarea>
        </div>

        <button type="submit" id="btn-submit-order" class="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl shadow-md hover:bg-emerald-700 active:scale-[0.99] transition">
          送出訂單
        </button>
      </form>
    </div>
  </main>

  <script>
    // ⚠️ 您的 GAS 部署網址
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxQsDLOyagMbYOOw-uYBozoZXRRq5fmEutsZCn0Q3DjtNjq9Uf10PQ7zMsXETsy0UKf/exec";

    let fruitsData = [];
    let cart = {};

    window.onload = function() {
      loadFruits();
    };

    async function callGasApi(action, extraData = {}) {
      try {
        const payload = JSON.stringify({ action: action, ...extraData });
        const res = await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: payload
        });
        return await res.json();
      } catch (err) {
        console.error("API 呼叫失敗:", err);
        return { status: "error", message: "網路通訊失敗: " + err.message };
      }
    }

    async function loadFruits() {
      const res = await callGasApi("getFruits");
      if (res && res.status === "success") {
        fruitsData = res.data;
        renderShopFruits();
      }
    }

   // 💡 渲染商品列表（含商品說明、庫存與 Edge 防阻擋圖片設定）
    function renderShopFruits() {
      const container = document.getElementById('shop-fruit-list');
      const activeFruits = fruitsData.filter(f => f.status === 'ON');

      if (activeFruits.length === 0) {
        container.innerHTML = `<div class="col-span-full text-center py-8 text-slate-400">目前尚無上架的水果項目</div>`;
        return;
      }

      container.innerHTML = activeFruits.map(fruit => {
        // 讀取庫存 (若沒設定庫存預設為 0)
        const stock = fruit.stock !== undefined ? Number(fruit.stock) : 0;
        const isSoldOut = stock <= 0;

        return `
          <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden flex flex-col justify-between hover:shadow-md transition ${isSoldOut ? 'opacity-80' : ''}">
            <!-- 商品圖片區塊 (含 Edge 瀏覽器防阻擋標籤) -->
            <div class="h-48 bg-slate-100 relative overflow-hidden flex items-center justify-center">
              ${fruit.imageUrl 
                ? `<img src="${fruit.imageUrl}" referrerpolicy="no-referrer" class="w-full h-full object-contain p-2">` 
                : `<div class="w-full h-full flex items-center justify-center text-slate-300 text-4xl">🍎</div>`}
                
              <!-- 💡 剩餘庫存標籤 -->
              <div class="absolute top-3 right-3">
                ${isSoldOut 
                  ? `<span class="bg-red-500 text-white text-xs font-bold px-2.5 py-1 rounded-full shadow">已售完</span>`
                  : `<span class="bg-emerald-600/90 text-white text-xs font-bold px-2.5 py-1 rounded-full shadow">剩餘 ${stock} 斤</span>`
                }
              </div>
            </div>

            <!-- 商品文字與說明區塊 -->
            <div class="p-5 flex-1 flex flex-col justify-between space-y-4">
              <div>
                <h3 class="text-lg font-bold text-slate-800">${fruit.name}</h3>
                
                <!-- 💡 商品說明 (有填寫時才顯示，支援自動換行) -->
                ${fruit.description 
                  ? `<p class="text-xs text-slate-500 mt-1.5 leading-relaxed whitespace-pre-line bg-slate-50 p-2 rounded-lg border border-slate-100">${fruit.description}</p>` 
                  : ''
                }

                <p class="text-emerald-600 font-extrabold text-xl mt-2">$${fruit.price} <span class="text-xs text-slate-400 font-normal">/ 斤</span></p>
              </div>
              
              <!-- 💡 數量調整按鈕 (售完時禁用) -->
              <div class="flex items-center justify-between bg-slate-50 p-2 rounded-xl border border-slate-200">
                <span class="text-xs font-bold text-slate-500 pl-2">數量(斤)</span>
                <div class="flex items-center space-x-2">
                  <button onclick="updateCart('${fruit.id}', -1)" ${isSoldOut ? 'disabled' : ''} class="w-8 h-8 rounded-lg bg-white border shadow-sm font-bold text-slate-600 hover:bg-slate-100 disabled:opacity-40 disabled:cursor-not-allowed">-</button>
                  <span id="qty-${fruit.id}" class="w-8 text-center font-bold">${cart[fruit.id] || 0}</span>
                  <button onclick="updateCart('${fruit.id}', 1)" ${isSoldOut ? 'disabled' : ''} class="w-8 h-8 rounded-lg bg-white border shadow-sm font-bold text-slate-600 hover:bg-slate-100 disabled:opacity-40 disabled:cursor-not-allowed">+</button>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // 💡 加減購物車數量（檢查庫存上限）
    function updateCart(fruitId, delta) {
      const fruit = fruitsData.find(f => f.id === fruitId);
      if (!fruit) return;

      const stock = fruit.stock !== undefined ? Number(fruit.stock) : 0;
      const currentQty = cart[fruitId] || 0;
      const newQty = currentQty + delta;

      // 檢查是否超過庫存
      if (delta > 0 && newQty > stock) {
        alert(`【${fruit.name}】目前剩餘庫存只有 ${stock} 斤喔！`);
        return;
      }

      if (newQty <= 0) {
        delete cart[fruitId];
      } else {
        cart[fruitId] = newQty;
      }

      const qtyElem = document.getElementById(`qty-${fruitId}`);
      if (qtyElem) qtyElem.innerText = cart[fruitId] || 0;

      renderCartSummary();
    }

    function renderCartSummary() {
      const container = document.getElementById('cart-summary');
      let total = 0;
      let itemsSummary = [];

      Object.keys(cart).forEach(id => {
        const fruit = fruitsData.find(f => f.id === id);
        if (fruit) {
          const subtotal = fruit.price * cart[id];
          total += subtotal;
          itemsSummary.push(`${fruit.name} x ${cart[id]}斤 ($${subtotal})`);
        }
      });

      document.getElementById('cart-total').innerText = total;
      container.innerHTML = itemsSummary.length === 0 ? "尚未選擇任何水果" : itemsSummary.join('<br>');
    }

    async function submitOrder(e) {
      e.preventDefault();
      if (Object.keys(cart).length === 0) {
        alert("請至少選擇一種水果！");
        return;
      }

      let itemsSummaryArray = [];
      Object.keys(cart).forEach(id => {
        const fruit = fruitsData.find(f => f.id === id);
        if (fruit) {
          itemsSummaryArray.push(`${fruit.name} x ${cart[id]}斤`);
        }
      });

      const orderData = {
        name: document.getElementById('cust-name').value,
        phone: document.getElementById('cust-phone').value,
        email: document.getElementById('cust-email').value,
        address: document.getElementById('cust-address').value,
        note: document.getElementById('cust-note').value,
        items: itemsSummaryArray.join(", "),
        totalAmount: Number(document.getElementById('cart-total').innerText)
      };

      const btn = document.getElementById('btn-submit-order');
      btn.disabled = true;
      btn.innerText = "提交中...";

      const res = await callGasApi("createOrder", orderData);
      btn.disabled = false;
      btn.innerText = "送出訂單";

      if (res.status === "success") {
        alert("🎉 " + res.message + "\n您的訂單編號為：" + res.orderId);
        cart = {};
        document.getElementById('order-form').reset();
        renderShopFruits();
        renderCartSummary();
      } else {
        alert("訂單提交失敗：" + res.message);
      }
    }
  </script>
</body>
</html>
